# =====================================================================
# Stillbrook -- vsftpd 2.3.4 configuration (backdoored build)
#
# The banner lies on purpose: it promises that any username and any
# password will do.  Every login is accepted and the session runs as
# the unprivileged "nobody" account.  The hidden account "test" is the
# one that hands out a shell.
# =====================================================================

# --- listener ----------------------------------------------------------
listen=YES
listen_ipv6=NO
listen_address=0.0.0.0
listen_port=21
background=NO

# --- authentication ----------------------------------------------------
anonymous_enable=NO
local_enable=YES
ftp_username=nobody

# --- sessions ----------------------------------------------------------
write_enable=NO
dirmessage_enable=NO
xferlog_enable=NO
connect_from_port_20=NO
chroot_local_user=NO
secure_chroot_dir=/
hide_ids=YES
use_localtime=NO

# --- banner ------------------------------------------------------------
ftpd_banner=vsFTPd 2.3.4 ready...

# --- passive port range ------------------------------------------------
pasv_min_port=30000
pasv_max_port=31000
