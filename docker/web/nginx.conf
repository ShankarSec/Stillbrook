load_module modules/ngx_http_headers_more_filter_module.so;

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # 20 requests/minute == 10 requests per 30 seconds.
    limit_req_zone $binary_remote_addr zone=scanner:10m rate=20r/m;
    # A per-endpoint guard makes the "10 rapid hits on one URL -> 429"
    # threshold deterministic; the scanner zone above still applies to
    # all traffic from the same client across every endpoint.
    limit_req_zone $binary_remote_addr$request_uri zone=scanner_endpoint:10m rate=20r/m;
    limit_req_status 429;

    # ------------------------------------------------------------------
    # Port 80 -- nginx in front of Flask (127.0.0.1:5000) and php-fpm.
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # Hide both nginx's own Server header and the one Flask adds,
        # plus any X-Powered-By emitted by PHP/FastCGI.
        more_clear_headers Server X-Powered-By;
        add_header X-App "Stillbrook Internal Portal v2.4" always;

        # Applies to proxied Flask requests AND direct PHP files.
        limit_req zone=scanner burst=20 nodelay;
        limit_req zone=scanner_endpoint burst=9 nodelay;

        # PHP webshell / any other PHP file is served by php-fpm directly,
        # never by Flask. No Flask route, no WAF, no link from any page.
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
        }
    }

    # ------------------------------------------------------------------
    # Port 443 -- self-signed cert, everything 301-redirected to plain
    # HTTP so the portal stays reachable on port 80.
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/stillbrook.crt;
        ssl_certificate_key /etc/nginx/ssl/stillbrook.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        more_clear_headers Server X-Powered-By;
        add_header X-App "Stillbrook Internal Portal v2.4" always;

        limit_req zone=scanner burst=20 nodelay;
        limit_req zone=scanner_endpoint burst=9 nodelay;

        return 301 http://$host$request_uri;
    }

    # ------------------------------------------------------------------
    # Port 8080 -- fake Tomcat 8.5.51 (decoy service fingerprint).
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        more_set_headers "Server: Apache-Coyote/1.1";

        limit_req zone=scanner burst=20 nodelay;
        limit_req zone=scanner_endpoint burst=9 nodelay;

        location = /manager/html {
            return 404;
        }

        location / {
            default_type text/html;
            return 200 "<!DOCTYPE html><html><head><title>Apache Tomcat/8.5.51</title></head><body><h1>Apache Tomcat/8.5.51</h1><p>If you're seeing this, you've reached the default Tomcat instance.</p></body></html>";
        }
    }

    # ------------------------------------------------------------------
    # Port 9090 -- fake Grafana monitoring endpoint (always down).
    # ------------------------------------------------------------------
    server {
        listen 9090;
        server_name _;

        more_clear_headers Server X-Powered-By;

        limit_req zone=scanner burst=20 nodelay;
        limit_req zone=scanner_endpoint burst=9 nodelay;

        location / {
            default_type text/plain;
            return 503 "Service Unavailable - Stillbrook Monitoring";
        }
    }
}
