# Dante SOCKS5 -- Stillbrook SSH jumpbox.
# Reachable from the lab network only; may relay to the internal network.
logoutput: /var/log/dante.log
debug: 0

internal: 0.0.0.0 port = 1080
external: eth0

# Authenticate against the jumpbox system accounts (m.rivera).
method: username
user.privileged: root
user.unprivileged: nobody

# Clients: lab network only.
client pass {
    from: 172.29.0.0/16 to: 0.0.0.0/0
    log: connect disconnect error
}

# Destinations: the internal network only.
socks pass {
    from: 172.29.0.0/16 to: 172.28.0.0/16
    protocol: tcp udp
    log: connect disconnect error
}
