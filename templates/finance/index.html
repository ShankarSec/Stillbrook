{% extends "layout.html" %}
{% block content %}
<h2>Finance — Reports</h2>
<p class="muted">Role: {{ role }}</p>
{% if reports %}
<table border="1" cellpadding="6">
  <tr><th>ID</th><th>Title</th><th>Owner</th><th>Date</th><th></th></tr>
  {% for r in reports %}
  <tr>
    <td>{{ r.id }}</td>
    <td>{{ r.title }}</td>
    <td>{{ r.owner }}</td>
    <td>{{ r.created }}</td>
    <td><a href="/api/v2/fin/exports/{{ r.id }}">View</a></td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p class="muted">No reports assigned to your account.</p>
{% endif %}
{% endblock %}
