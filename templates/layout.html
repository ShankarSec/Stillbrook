<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Stillbrook Corporation{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    .flash { background: #fff3cd; border: 1px solid #ffe69c; padding: 8px; margin-bottom: 12px; border-radius: 4px; }
    .muted { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Stillbrook Corporation</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
